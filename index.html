<!-- ========== HOSTCUT HERO — STRIPE-STYLE (ready to paste) ========== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #14120e;
    --paper: #f4f0e8;
    --card: #fffdf8;
    --muted: #6f675c;
    --orange: #f15a22;
    --line: #e4dccf;
    --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-serif: "Instrument Serif", Georgia, ui-serif, serif;
  }

  .hero {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    padding: 5.5rem 0 0;
  }

  .hero-inner {
    max-width: 42rem;          /* tighter central content like Stripe */
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* Eyebrow / live counter — left aligned like Stripe */
  .hero-stat {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.35rem 0.6rem;
    margin: 0 0 1.75rem;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  .hero-stat-value {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--ink);
  }

  /* Main headline */
  .hero-title {
    margin: 0;
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(2.75rem, 6.2vw, 4.6rem);
    line-height: 1.02;
    letter-spacing: -0.03em;
    color: var(--ink);
    max-width: 16ch;
  }

  /* Supporting text */
  .hero-lead {
    margin: 1.5rem 0 0;
    max-width: 36rem;
    font-size: 1.125rem;
    line-height: 1.65;
    color: var(--muted);
  }
  @media (min-width: 768px) {
    .hero-lead { font-size: 1.1875rem; }
  }

  /* Buttons — fully rounded */
  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 2.25rem;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 3rem;
    padding: 0 1.5rem;
    border-radius: 999px;
    font-size: 0.875rem;
    font-weight: 600;
    text-decoration: none;
    transition: transform 150ms ease, filter 150ms ease, border-color 150ms ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--orange);
    color: var(--paper);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover {
    border-color: color-mix(in srgb, var(--ink) 28%, transparent);
  }

  /* Logo marquee */
  .brand-marquee {
    margin-top: 5.5rem;
    padding-bottom: 3.5rem;
    overflow: hidden;
  }
  .brand-marquee-label {
    max-width: 72rem;
    margin: 0 auto 1.35rem;
    padding: 0 1.5rem;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--muted) 78%, transparent);
  }
  .brand-track-wrap {
    overflow: hidden;
    mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent);
  }
  .brand-track {
    display: flex;
    width: max-content;
    animation: brand-scroll 60s linear infinite;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 3.75rem;
    padding-right: 3.75rem;
  }
  .brand-logo {
    height: 28px;
    width: auto;
    object-fit: contain;
    opacity: 0.78;
    filter: grayscale(0.15);
    transition: opacity 180ms ease, filter 180ms ease;
  }
  .brand-logo:hover {
    opacity: 1;
    filter: grayscale(0);
  }

  @keyframes brand-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand-track { animation: none; }
  }

  /* Mobile */
  @media (max-width: 720px) {
    .hero { padding-top: 4rem; }
    .hero-title { max-width: none; font-size: clamp(2.6rem, 11vw, 3.4rem); }
    .hero-actions { flex-direction: column; }
    .hero-actions .btn { width: 100%; }
    .brand-group { gap: 2.75rem; padding-right: 2.75rem; }
    .brand-logo { height: 24px; }
  }
</style>

</section>

<script>
  // Live $ counter — starts at $29 and adds $29 at random intervals
  (function () {
    const el = document.getElementById("savingsCounter");
    if (!el) return;

    let value = 29;
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function format(n) {
      return "$" + n.toLocaleString("en-US");
    }

    function tick() {
      value += 29;
      el.textContent = format(value);
      const delay = reduced ? 4200 : 700 + Math.random() * 2800;
      setTimeout(tick, delay);
    }

    setTimeout(tick, reduced ? 1600 : 1100);
  })();
</script>
